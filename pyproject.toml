[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topics-ternary"
version = "0.1.0"
description = "Traceable, conformer-driven PROTAC ternary assembly and structural controls"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "rdkit>=2024.9", "gemmi>=0.7,<1", "matplotlib>=3.8,<4", "plotly>=6,<8", "threadpoolctl>=3,<4"]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13,<15", "nvidia-cuda-nvrtc-cu12", "nvidia-cuda-runtime-cu12"]
dev = ["pytest>=8", "build"]

[project.scripts]
topics = "topics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
